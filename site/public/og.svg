  <text x="60" y="360" font-family="Inter, sans-serif" font-size="32" font-weight="400" fill="#A1A1AA">Recover ECDSA private keys from a single signature.</text>
  <text x="60" y="500" font-family="JetBrains Mono, monospace" font-size="20" fill="#71717A">$ nonce-cracker run --r 0x... --s 0x... --z 0x... --pubkey 02...</text>
